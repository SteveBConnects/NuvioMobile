name: Build and Package Mobile Media Streamer iOS Build

on:
  push:
    branches: [ main, cmp-rewrite ]
  workflow_dispatch: # Allows manually triggering a build anytime

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin to iOS Framework
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      - name: Build Unsigned Xcode Project
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv iosApp/build/Release-iphoneos/iosApp.app Payload/Nuvio.app
          zip -r Nuvio.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
