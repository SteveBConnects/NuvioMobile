name: Build and Package Mobile Media Streamer iOS

on:
  push:
    branches: [ main, cmp-rewrite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin to iOS Framework
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      - name: Find and Build Xcode Project
        run: |
          # Dynamically finds the correct .xcodeproj file inside the iosApp directory
          XCODE_PROJ=$(ls -d iosApp/*.xcodeproj)
          XCODE_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          
          echo "Found project: $XCODE_NAME"
          
          xcodebuild -project "$XCODE_PROJ" \
                     -scheme "$XCODE_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Grabs whatever built .app file came out of the compilation process
          mv iosApp/build/Release-iphoneos/*.app Payload/Nuvio.app 2>/dev/null || mv build/ios/iphoneos/*.app Payload/Nuvio.app
          zip -r Nuvio.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
