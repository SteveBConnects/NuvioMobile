name: Build and Package Mobile Media Streamer iOS

on:
  push:
    branches: [ main, cmp-rewrite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Official Nuvio Build Script
        run: |
          chmod +x ./scripts/build-distribution.sh
          ./scripts/build-distribution.sh
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"

      - name: Package App Package to IPA
        run: |
          mkdir -p Payload
          # Finds the compiled app bundle and drops it into a standard sideloading shell
          find . -name "*.app" -type d -exec cp -R {} Payload/Nuvio.app \;
          zip -r Nuvio.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
