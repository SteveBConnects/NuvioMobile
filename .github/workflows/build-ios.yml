name: Build and Package Mobile Media Streamer iOS

on:
  push:
    branches: [ main, cmp-rewrite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shared Kotlin Framework
        run: |
          # Only run the task that successfully checked green in your logs
          ./gradlew :composeApp:assembleXcframework --no-daemon

      - name: Build Unsigned Native Xcode Project
        run: |
          XCODE_PROJ=$(ls -d iosApp/*.xcodeproj)
          XCODE_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          
          xcodebuild -project "$XCODE_PROJ" \
                     -scheme "$XCODE_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package App to IPA
        run: |
          mkdir -p Payload
          # Grabs the generated app bundle from the build products
          find . -name "*.app" -type d -exec cp -R {} Payload/Nuvio.app \;
          zip -r Nuvio.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
