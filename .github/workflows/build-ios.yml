name: Build and Package Mobile Media Streamer iOS

on:
  push:
    branches: [ main, cmp-rewrite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          submodules: false # We handle environment layout manually instead

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shared Kotlin Framework
        run: |
          ./gradlew :composeApp:assembleXcfMultiplatform --no-daemon || ./gradlew :composeApp:assembleReleaseXcfMultiplatform --no-daemon

      - name: Hardcode Environment & Erase Xcode Shell Scripts
        run: |
          XCODE_PBX="iosApp/NuvioMobile.xcodeproj/project.pbxproj"
          
          if [ -f "$XCODE_PBX" ]; then
            echo "Xcode project file located. Commencing script extraction..."
            
            # Create a backup of the original configuration layout
            cp "$XCODE_PBX" "${XCODE_PBX}.bak"
            
            # Brute-force strip out any lines trying to force shell-script git commands
            sed -i '' '/git submodule/d' "$XCODE_PBX" || true
            sed -i '' '/externalSTB/d' "$XCODE_PBX" || true
            
            echo "Xcode file modified successfully. External dependencies isolated."
          else
            echo "Warning: Target .xcodeproj wrapper file path not matched."
          fi

      - name: Build Unsigned Xcode Project
        run: |
          XCODE_PROJ=$(ls -d iosApp/*.xcodeproj)
          XCODE_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          
          xcodebuild -project "$XCODE_PROJ" \
                     -scheme "$XCODE_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build

      - name: Package App to IPA
        run: |
          mkdir -p Payload
          find . -name "*.app" -type d -exec cp -R {} Payload/Nuvio.app \;
          zip -r Nuvio.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
